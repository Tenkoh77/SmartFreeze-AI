[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfreeze-ml"
version = "0.1.0"
description = "SmartFreeze AI training pipeline: Isolation Forest anomaly detection for Android performance data"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.5,<1.10", "pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
